<template>
    <div class="modalScope">
        <template if:true={showGlobalSpinner}>
            <div class="overlay">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <div class="contentArea slds-p-around_medium">
            <!-- Top: Select + Add -->
            <div class="topBar slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1">
                    <div class="topControls">
                        <div class="searchPicklist">
                            <div class="searchField" role="combobox" aria-expanded={showViolationDropdown} aria-haspopup="listbox">
                                <input
                                    class="searchInput"
                                    type="text"
                                    value={violationSearchText}
                                    placeholder="Search violation..."
                                    autocomplete="off"
                                    onfocus={handleViolationInputFocus}
                                    onblur={handleViolationInputBlur}
                                    oninput={handleViolationSearchChange}
                                    onkeydown={handleViolationKeyDown}
                                />

                                <button
                                    class="clearBtn"
                                    title="Clear"
                                    type="button"
                                    onclick={handleClearViolation}
                                    aria-label="Clear selected violation"
                                    if:true={showClearViolation}>
                                    <span class="clearIcon">×</span>
                                </button>
                            </div>

                            <template if:true={showViolationDropdown}>
                                <div class="dropdown" role="listbox">
                                    <template if:true={filteredViolationOptions.length}>
                                        <template for:each={filteredViolationOptions} for:item="opt" for:index="index">
                                            <div
                                                key={opt.value}
                                                class={opt._class}
                                                role="option"
                                                data-value={opt.value}
                                                data-index={index}
                                                onclick={handleViolationSelect}>
                                                <div class="optLabel">{opt.label}</div>
                                            </div>
                                        </template>
                                    </template>

                                    <template if:false={filteredViolationOptions.length}>
                                        <div class="dropdownEmpty">No matches</div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <lightning-button
                            label="Add"
                            variant="brand"
                            class="addBtn"
                            onclick={handleAddRow}
                            disabled={isAddDisabled}>
                        </lightning-button>
                    </div>
                </div>
            </div>

            <!-- Villa Picture Card -->
            <section class="card slds-m-top_medium">
                <div class="cardHeader">
                    <div>
                        <div class="cardTitle">Villa Picture</div>
                        <div class="cardSub">Upload a villa picture. Required for Clear / Clear with Comments, or when there are no violations.</div>
                    </div>
                </div>

                <div class="cardBody">
                    <div class="villaRow">
                        <div class="villaLeft">
                            <template if:false={villaFiles.length}>
                                <div class="uploadCenter">
                                    <lightning-file-upload
                                        record-id={villaUploadRecordId}
                                        accept={acceptedFormats}
                                        onuploadfinished={handleVillaUploadFinished}
                                        disabled={isVillaUploadDisabled}>
                                    </lightning-file-upload>
                                </div>
                            </template>

                            <template if:true={villaFileError}>
                                <div class="errorText slds-m-top_small">
                                    {villaFileErrorMessage}
                                </div>
                            </template>

                            <template if:true={villaFiles.length}>
                                <div class="fileBlock">
                                    <template if:true={villaThumbUrl}>
                                        <div class="thumbWrap">
                                            <img class="thumbImg" src={villaThumbUrl} alt="Villa thumbnail" />
                                        </div>
                                    </template>

                                    <div class="fileMetaRow fileMeta">
                                        <div class="fileName textWrap">
                                            <span class="muted">Uploaded:</span>
                                            <template if:true={villaFileUrl}>
                                                <a class="fileLink" href={villaFileUrl} target="_blank">{villaFilesSummary}</a>
                                            </template>
                                            <template if:false={villaFileUrl}>
                                                <span>{villaFilesSummary}</span>
                                            </template>
                                        </div>
                                        <div class="fileActions">
                                            <lightning-button-icon
                                                class="removeBtn"
                                                icon-name="utility:close"
                                                alternative-text="Remove"
                                                title="Remove"
                                                onclick={handleClearVillaFile}>
                                            </lightning-button-icon>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="villaRight">
                            <!-- keeps side-by-side spacing; actual preview is above in fileBlock -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Empty State -->
            <template if:false={rows.length}>
                <div class="emptyState slds-m-top_large">
                    <div class="emptyTitle">No violations added yet</div>
                    <div class="emptySub">Select a violation above and click Add to create the first row.</div>
                </div>
            </template>

            <!-- Rows -->
            <template if:true={rows.length}>
                <section class="tableCard slds-m-top_medium">
                    <div class="tableHeader">
                        <div class="tableTitle">Violations</div>
                        <div class="tableSub">
                            {rows.length} item(s)
                            <template if:true={isParentMode}>
                                • Parent Case Mode (Before/After)
                            </template>
                            <template if:false={isParentMode}>
                                • Evidence Mode
                            </template>
                        </div>
                    </div>

                    <div class="tableWrap" role="region" aria-label="Violations table">
                        <table class="slds-table slds-table_cell-buffer slds-table_fixed-layout uiTable">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col" class="colLabel"><div class="slds-truncate" title="Label">Label</div></th>
                                    <th scope="col" class="colDescription"><div class="slds-truncate" title="Description">Description</div></th>
                                    <th scope="col" class="colCategory"><div class="slds-truncate" title="Category">Category</div></th>

                                    <template if:true={isParentMode}>
                                        <th scope="col" class="colBefore"><div class="slds-truncate" title="Before Photos">Before Photos</div></th>
                                        <th scope="col" class="colAfter"><div class="slds-truncate" title="After Photos">After Photos</div></th>
                                        <th scope="col" class="colFixed"><div class="slds-truncate" title="Fixed">Fixed</div></th>
                                        <th scope="col" class="colActions"><div class="slds-truncate" title="Delete">Delete</div></th>
                                    </template>

                                    <template if:false={isParentMode}>
                                        <th scope="col" class="colEvidence"><div class="slds-truncate" title="Evidence">Evidence</div></th>
                                        <th scope="col" class="colActions"><div class="slds-truncate" title="Delete">Delete</div></th>
                                    </template>
                                </tr>
                            </thead>

                            <tbody>
                                <template for:each={rows} for:item="row">
                                    <tr key={row.rowId} class="rowHover">
                                        <!-- 1) Label -->
                                        <td data-label="Label" class="colLabel">
                                            <div class="cellMain textWrap">
                                                <div class="labelText">{row.name}</div>
                                            </div>
                                        </td>

                                        <!-- 2) Description -->
                                        <td data-label="Description" class="colDescription">
                                            <div class="cellMain textWrap">
                                                <template if:true={row.isOther}>
                                                    <lightning-textarea
                                                        class="tightTextarea"
                                                        label=""
                                                        value={row.description}
                                                        placeholder="Enter description..."
                                                        onchange={handleRowDescriptionChange}
                                                        data-rowid={row.rowId}
                                                        disabled={row.isDescriptionDisabled}>
                                                    </lightning-textarea>
                                                </template>

                                                <template if:false={row.isOther}>
                                                    <div class="descText">{row.description}</div>
                                                </template>
                                            </div>
                                        </td>

                                        <!-- 3) Category -->
                                        <td data-label="Category" class="colCategory">
                                            <div class="cellMain">
                                                <lightning-combobox
                                                    label=""
                                                    value={row.category}
                                                    placeholder="Select..."
                                                    options={categoryOptions}
                                                    onchange={handleRowCategoryChange}
                                                    data-rowid={row.rowId}
                                                    disabled={row.isCategoryDisabledFinal}>
                                                </lightning-combobox>
                                            </div>
                                        </td>

                                        <!-- Parent mode -->
                                        <template if:true={isParentMode}>
                                            <!-- 4) Before -->
                                            <td data-label="Before Photos" class="colBefore">
                                                <div class="cellMain">
                                                    <template if:true={row.isNewInFollowUp}>
                                                        <template if:false={row.beforeFiles.length}>
                                                            <div class="uploadCenter">
                                                                <lightning-file-upload
                                                                    record-id={row.beforeUploadRecordId}
                                                                    accept={acceptedFormats}
                                                                    onuploadfinished={handleBeforeUploadFinished}
                                                                    data-rowid={row.rowId}
                                                                    disabled={row.isBeforeUploadDisabled}>
                                                                </lightning-file-upload>
                                                            </div>
                                                        </template>

                                                        <template if:true={row.beforeUploadError}>
                                                            <div class="errorText slds-m-top_x-small">{row.beforeUploadErrorMessage}</div>
                                                        </template>

                                                        <template if:true={row.beforeFiles.length}>
                                                            <div class="fileBlock">
                                                                <template if:true={row.beforeThumbUrl}>
                                                                    <div class="thumbWrap">
                                                                        <img class="thumbImg" src={row.beforeThumbUrl} alt="Before thumbnail" />
                                                                    </div>
                                                                </template>

                                                                <div class="fileMetaRow fileMeta">
                                                                    <div class="fileName textWrap">
                                                                        <template if:true={row.beforeFileUrl}>
                                                                            <a class="fileLink" href={row.beforeFileUrl} target="_blank">{row.beforeFilesSummary}</a>
                                                                        </template>
                                                                        <template if:false={row.beforeFileUrl}>
                                                                            <span>{row.beforeFilesSummary}</span>
                                                                        </template>
                                                                    </div>
                                                                    <div class="fileActions">
                                                                        <lightning-button-icon
                                                                            class="removeBtn"
                                                                            icon-name="utility:close"
                                                                            alternative-text="Remove"
                                                                            title="Remove"
                                                                            onclick={handleClearBeforeFile}
                                                                            data-rowid={row.rowId}
                                                                            disabled={row.isRowDisabled}>
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </template>

                                                    <template if:false={row.isNewInFollowUp}>
                                                        <template if:true={row.beforeFiles.length}>
                                                            <div class="fileBlock">
                                                                <template if:true={row.beforeThumbUrl}>
                                                                    <div class="thumbWrap">
                                                                        <img class="thumbImg" src={row.beforeThumbUrl} alt="Before thumbnail" />
                                                                    </div>
                                                                </template>
                                                                <div class="fileMetaRow fileMeta">
                                                                    <div class="fileName textWrap">
                                                                        <template if:true={row.beforeFileUrl}>
                                                                            <a class="fileLink" href={row.beforeFileUrl} target="_blank">{row.beforeFilesSummary}</a>
                                                                        </template>
                                                                        <template if:false={row.beforeFileUrl}>
                                                                            <span>{row.beforeFilesSummary}</span>
                                                                        </template>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <template if:false={row.beforeFiles.length}>
                                                            <div class="fileMeta muted">No old photos</div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </td>

                                            <!-- 5) After -->
                                            <td data-label="After Photos" class="colAfter">
                                                <div class="cellMain">
                                                    <template if:true={row.isNewInFollowUp}>
                                                        <div class="fileMeta muted">After photo will be captured in the next inspection.</div>
                                                    </template>

                                                    <template if:false={row.isNewInFollowUp}>
                                                        <template if:true={row.isAfterDocCreating}>
                                                            <div class="uploadCenter slds-is-relative" style="min-height: 2.5rem;">
                                                                <lightning-spinner alternative-text="Preparing upload..." size="small"></lightning-spinner>
                                                            </div>
                                                        </template>

                                                        <template if:false={row.isAfterDocCreating}>
                                                            <template if:false={row.afterFiles.length}>
                                                                <div class="uploadCenter">
                                                                    <lightning-file-upload
                                                                        record-id={row.afterUploadRecordId}
                                                                        accept={acceptedFormats}
                                                                        onuploadfinished={handleAfterUploadFinished}
                                                                        data-rowid={row.rowId}
                                                                        disabled={row.isAfterUploadDisabled}>
                                                                    </lightning-file-upload>
                                                                </div>
                                                            </template>
                                                        </template>

                                                        <template if:true={row.afterFileError}>
                                                            <div class="errorText slds-m-top_x-small">{row.afterFileErrorMessage}</div>
                                                        </template>

                                                        <template if:true={row.afterFiles.length}>
                                                            <div class="fileBlock">
                                                                <template if:true={row.afterThumbUrl}>
                                                                    <div class="thumbWrap">
                                                                        <img class="thumbImg" src={row.afterThumbUrl} alt="After thumbnail" />
                                                                    </div>
                                                                </template>

                                                                <div class="fileMetaRow fileMeta">
                                                                    <div class="fileName textWrap">
                                                                        <template if:true={row.afterFileUrl}>
                                                                            <a class="fileLink" href={row.afterFileUrl} target="_blank">{row.afterFilesSummary}</a>
                                                                        </template>
                                                                        <template if:false={row.afterFileUrl}>
                                                                            <span>{row.afterFilesSummary}</span>
                                                                        </template>
                                                                    </div>
                                                                    <div class="fileActions">
                                                                        <lightning-button-icon
                                                                            class="removeBtn"
                                                                            icon-name="utility:close"
                                                                            alternative-text="Remove"
                                                                            title="Remove"
                                                                            onclick={handleClearAfterFile}
                                                                            data-rowid={row.rowId}
                                                                            disabled={row.isRowDisabled}>
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </td>

                                            <!-- 6) Fixed -->
                                            <td data-label="Fixed" class="colFixed">
                                                <div class="cellMain">
                                                    <lightning-input
                                                        type="checkbox"
                                                        checked={row.isFixed}
                                                        onchange={handleRowIsFixedChange}
                                                        data-rowid={row.rowId}
                                                        disabled={row.isFixedDisabledFinal}>
                                                    </lightning-input>
                                                </div>
                                            </td>

                                            <!-- 7) Delete -->
                                            <td data-label="Delete" class="colActions">
                                                <div class="cellActions">
                                                    <lightning-button-icon
                                                        icon-name="utility:delete"
                                                        alternative-text="Delete"
                                                        title="Delete"
                                                        onclick={handleDeleteRow}
                                                        data-rowid={row.rowId}
                                                        disabled={row.isDeleteDisabledFinal}>
                                                    </lightning-button-icon>
                                                </div>
                                            </td>
                                        </template>

                                        <!-- Evidence mode -->
                                        <template if:false={isParentMode}>
                                            <td data-label="Evidence" class="colEvidence">
                                                <div class="cellMain">
                                                    <template if:true={row.isDocCreating}>
                                                        <div class="uploadCenter slds-is-relative" style="min-height: 2.5rem;">
                                                            <lightning-spinner alternative-text="Preparing upload..." size="small"></lightning-spinner>
                                                        </div>
                                                    </template>
                                                    <template if:false={row.isDocCreating}>
                                                        <template if:false={row.files.length}>
                                                            <div class="uploadCenter">
                                                                <lightning-file-upload
                                                                    record-id={row.evidenceUploadRecordId}
                                                                    accept={acceptedFormats}
                                                                    onuploadfinished={handleUploadFinished}
                                                                    data-rowid={row.rowId}
                                                                    disabled={row.isDocNotReady}>
                                                                </lightning-file-upload>
                                                            </div>
                                                        </template>
                                                    </template>

                                                    <template if:true={row.fileError}>
                                                        <div class="errorText slds-m-top_x-small">
                                                            {row.fileErrorMessage}
                                                        </div>
                                                    </template>

                                                    <template if:true={row.files.length}>
                                                        <div class="fileBlock">
                                                            <template if:true={row.fileThumbUrl}>
                                                                <div class="thumbWrap">
                                                                    <img class="thumbImg" src={row.fileThumbUrl} alt="Evidence thumbnail" />
                                                                </div>
                                                            </template>

                                                            <div class="fileMetaRow fileMeta">
                                                                <div class="fileName textWrap">
                                                                    <template if:true={row.fileUrl}>
                                                                        <a class="fileLink" href={row.fileUrl} target="_blank">{row.filesSummary}</a>
                                                                    </template>
                                                                    <template if:false={row.fileUrl}>
                                                                        <span>{row.filesSummary}</span>
                                                                    </template>
                                                                </div>
                                                                <div class="fileActions">
                                                                    <lightning-button-icon
                                                                        class="removeBtn"
                                                                        icon-name="utility:close"
                                                                        alternative-text="Remove"
                                                                        title="Remove"
                                                                        onclick={handleClearEvidenceFile}
                                                                        data-rowid={row.rowId}>
                                                                    </lightning-button-icon>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </td>

                                            <td data-label="Delete" class="colActions">
                                                <div class="cellActions">
                                                    <lightning-button-icon
                                                        icon-name="utility:delete"
                                                        alternative-text="Delete"
                                                        title="Delete"
                                                        onclick={handleDeleteRow}
                                                        data-rowid={row.rowId}>
                                                    </lightning-button-icon>
                                                </div>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </section>
            </template>
        </div>
    </div>
</template>
